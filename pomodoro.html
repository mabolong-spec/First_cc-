<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 - Pomodoro Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161613;
    --surface: #1f1f1b;
    --surface-elevated: #292925;
    --text: #ede8de;
    --text-secondary: #b8b3a6;
    --text-dim: #706c62;
    --brass: #c7783c;
    --brass-dim: rgba(199, 120, 60, 0.15);
    --brass-glow: rgba(199, 120, 60, 0.35);
    --break-teal: #5a8f7a;
    --break-teal-dim: rgba(90, 143, 122, 0.15);
    --break-teal-glow: rgba(90, 143, 122, 0.3);
    --long-steel: #6b7d8e;
    --long-steel-dim: rgba(107, 125, 142, 0.15);
    --long-steel-glow: rgba(107, 125, 142, 0.3);
    --ring-bg: #2a2a25;
    --border: #33332e;
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-mono: 'DM Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
    --font-ui: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 40% 20%, rgba(199,120,60,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 60% 80%, rgba(90,143,122,0.03) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.004) 2px, rgba(255,255,255,0.004) 4px);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    width: 440px;
    padding: 36px 32px;
    background: var(--surface);
    border-radius: 4px;
    border: 1px solid var(--border);
    box-shadow:
      0 24px 64px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.02);
    transition: opacity 0.3s;
    position: relative;
  }
  /* Subtle top accent line — like the edge of a machined part */
  .app::before {
    content: '';
    position: absolute;
    top: 0; left: 32px; right: 32px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity: 0.5;
  }

  /* ── Mode Selector ── */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--bg);
    border-radius: 2px;
    padding: 3px;
    margin-bottom: 36px;
    margin-top: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    border-radius: 2px;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active {
    background: var(--surface-elevated);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .tab.focus::after,
  .tab.short::after,
  .tab.long::after {
    content: '';
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 2px;
    border-radius: 1px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab.focus::after { background: var(--brass); }
  .tab.short::after { background: var(--break-teal); }
  .tab.long::after { background: var(--long-steel); }
  .tab.focus.active::after { width: 16px; }
  .tab.short.active::after { width: 16px; }
  .tab.long.active::after { width: 16px; }

  /* ── Timer Ring ── */
  .timer-container {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }
  .ring-wrapper { position: relative; width: 280px; height: 280px; }

  /* Tick marks — 12 lines like a watch dial */
  .dial-ticks {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .dial-tick {
    position: absolute;
    top: 0; left: 50%;
    width: 1px; height: 100%;
    transform-origin: center;
    opacity: 0.15;
  }
  .dial-tick::before {
    content: '';
    position: absolute;
    top: 14px; left: 0;
    width: 1px; height: 8px;
    background: var(--text-secondary);
  }
  .dial-tick.major::before {
    height: 14px;
    width: 1.5px;
    opacity: 1;
  }

  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 5;
  }
  .ring-fg {
    fill: none;
    stroke: var(--brass);
    stroke-width: 5;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
    filter: drop-shadow(0 0 10px var(--brass-glow));
  }
  .ring-fg.short-mode {
    stroke: var(--break-teal);
    filter: drop-shadow(0 0 10px var(--break-teal-glow));
  }
  .ring-fg.long-mode {
    stroke: var(--long-steel);
    filter: drop-shadow(0 0 10px var(--long-steel-glow));
  }
  .ring-fg.pulse {
    animation: ringPulse 0.7s ease-out;
  }
  @keyframes ringPulse {
    0%   { stroke-width: 5;  filter: drop-shadow(0 0 6px var(--brass-glow)); }
    35%  { stroke-width: 12; filter: drop-shadow(0 0 32px var(--brass-glow)); }
    100% { stroke-width: 5;  filter: drop-shadow(0 0 10px var(--brass-glow)); }
  }

  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time-text {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-style: italic;
    letter-spacing: 0px;
    line-height: 1;
    color: var(--text);
    transition: transform 0.2s;
  }
  .time-text.pop {
    animation: timePop 0.5s ease-out;
  }
  @keyframes timePop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .time-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ── Sound ── */
  .sound-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .btn-sound {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-sound:hover { color: var(--text-secondary); border-color: var(--text-dim); }
  .btn-sound.active {
    color: var(--brass);
    border-color: var(--brass);
    background: var(--brass-dim);
  }
  .sound-type {
    padding: 5px 10px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    -webkit-appearance: none;
    appearance: none;
  }
  .sound-type.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .sound-type option {
    background: var(--surface-elevated);
    color: var(--text);
  }
  .sound-vol {
    width: 60px;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--ring-bg);
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .sound-vol.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .sound-vol::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--text-dim);
    cursor: pointer;
  }
  .sound-vol::-webkit-slider-thumb:hover { background: var(--brass); }
  .sound-vol::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 2px;
    border: none;
    background: var(--text-dim);
    cursor: pointer;
  }
  .sound-vol::-moz-range-thumb:hover { background: var(--brass); }

  /* ── Controls ── */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    margin-bottom: 32px;
  }
  .btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
  }
  .btn:hover { color: var(--text); border-color: var(--text-dim); }
  .btn:active { transform: scale(0.94); }
  .btn-play {
    width: 68px; height: 68px;
    font-size: 22px;
    background: var(--brass);
    color: #fff;
    border: none;
    box-shadow: 0 4px 24px var(--brass-glow);
  }
  .btn-play:hover { background: #d48548; color: #fff; }
  .btn-play.running {
    background: transparent;
    color: var(--brass);
    border: 1.5px solid var(--brass);
    box-shadow: none;
  }
  .btn-play.running:hover { background: var(--brass-dim); }

  /* ── Stats ── */
  .stats-row {
    display: flex;
    gap: 2px;
    margin-bottom: 28px;
  }
  .stat-card {
    flex: 1;
    background: var(--bg);
    padding: 16px 12px;
    text-align: center;
    border: 1px solid transparent;
    transition: border-color 0.3s;
  }
  .stat-card:first-child { border-radius: 2px 0 0 2px; }
  .stat-card:last-child  { border-radius: 0 2px 2px 0; }
  .stat-card:hover { border-color: var(--border); }
  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    font-style: italic;
    line-height: 1.1;
    color: var(--text);
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ── Tasks ── */
  .section-title {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 12px;
  }
  .task-input-row {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }
  .task-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .task-input:focus { border-color: var(--brass); }
  .task-input::placeholder { color: var(--text-dim); }
  .btn-add {
    padding: 10px 18px;
    border-radius: 2px;
    border: none;
    background: var(--brass);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add:hover { background: #d48548; }
  .btn-add:active { transform: scale(0.97); }

  .task-list { list-style: none; max-height: 155px; overflow-y: auto; }
  .task-list::-webkit-scrollbar { width: 3px; }
  .task-list::-webkit-scrollbar-thumb { background: var(--ring-bg); border-radius: 1px; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-left: 2px solid transparent;
    margin-bottom: 1px;
    transition: all 0.2s;
  }
  .task-item:hover { background: rgba(255,255,255,0.015); }
  .task-item.done { border-left-color: var(--break-teal); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text-dim); }
  .task-check {
    width: 16px; height: 16px;
    border: 1.5px solid var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: transparent;
    font-family: var(--font-mono);
  }
  .task-check:hover { border-color: var(--break-teal); }
  .task-item.done .task-check {
    background: var(--break-teal);
    border-color: var(--break-teal);
    color: #fff;
  }
  .task-text { flex: 1; font-size: 13px; }
  .task-delete {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    font-size: 14px; padding: 2px 6px;
    opacity: 0; transition: all 0.15s;
    font-family: var(--font-mono);
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: #d4644a; }

  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 22px 0;
    opacity: 0.5;
    letter-spacing: 1px;
  }

  /* ── Opacity ── */
  .opacity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    opacity: 0.4;
    transition: opacity 0.25s;
  }
  .opacity-row:hover { opacity: 1; }
  .opacity-row label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .opacity-row input[type="range"] {
    flex: 1;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--ring-bg);
    outline: none;
  }
  .opacity-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 2px;
    background: var(--text-dim);
    cursor: pointer;
    transition: background 0.2s;
  }
  .opacity-row input[type="range"]::-webkit-slider-thumb:hover {
    background: var(--brass);
  }
  .opacity-row input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 2px;
    border: none;
    background: var(--text-dim);
    cursor: pointer;
  }
  .opacity-value {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    min-width: 2.5em;
    text-align: right;
  }
</style>
</head>
<body>

<div class="app" id="appRoot">
  <!-- Mode Tabs -->
  <div class="tabs">
    <button class="tab focus active" data-mode="focus">Focus</button>
    <button class="tab short" data-mode="short">Break</button>
    <button class="tab long" data-mode="long">Rest</button>
  </div>

  <!-- Timer -->
  <div class="timer-container">
    <div class="ring-wrapper">
      <svg width="280" height="280" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="128"/>
        <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="128"
                stroke-dasharray="804.248" stroke-dashoffset="0"/>
      </svg>
      <div class="time-display">
        <div class="time-text" id="timeText">25:00</div>
        <div class="time-label" id="timeLabel">专注</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="btnReset" title="重置">⟲</button>
    <button class="btn btn-play" id="btnPlay" title="开始">▶</button>
    <button class="btn" id="btnSkip" title="跳过">↷</button>
  </div>

  <!-- Sound -->
  <div class="sound-row">
    <button class="btn-sound" id="btnSound" title="背景音">♪</button>
    <select class="sound-type" id="soundType">
      <option value="white">白噪音</option>
      <option value="pink">粉噪音</option>
      <option value="brown">棕噪音</option>
      <option value="rain">雨声</option>
    </select>
    <input type="range" class="sound-vol" id="soundVol" min="5" max="40" value="15" step="1" title="音量">
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="sessionCount">0</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalFocus">0 min</div>
      <div class="stat-label">Focus Time</div>
    </div>
  </div>

  <!-- Tasks -->
  <div class="section-title">Tasks</div>
  <div class="task-input-row">
    <input class="task-input" id="taskInput" placeholder="添加任务..." maxlength="80">
    <button class="btn-add" id="btnAdd">添加</button>
  </div>
  <ul class="task-list" id="taskList"></ul>

  <!-- Opacity -->
  <div class="opacity-row">
    <label for="opacitySlider">Opacity</label>
    <input type="range" id="opacitySlider" min="30" max="100" value="100" step="1">
    <span class="opacity-value" id="opacityValue">100%</span>
  </div>
</div>

<script>
  const MODES = {
    focus: { label: '专注', minutes: 25, color: '#c7783c', css: 'focus' },
    short: { label: '短休', minutes: 5, color: '#5a8f7a', css: 'short' },
    long:  { label: '长休', minutes: 15, color: '#6b7d8e', css: 'long' }
  };

  const CIRCUMFERENCE = 2 * Math.PI * 128;
  const OPACITY_MIN = 30;
  const OPACITY_MAX = 100;

  let mode = 'focus';
  let totalSeconds = MODES.focus.minutes * 60;
  let remainingSeconds = totalSeconds;
  let timerInterval = null;
  let sessionCount = parseInt(localStorage.getItem('pomo_sessions') || '0');
  let totalFocusMin = parseInt(localStorage.getItem('pomo_focus_min') || '0');
  let tasks = JSON.parse(localStorage.getItem('pomo_tasks') || '[]');
  let soundPrefs = JSON.parse(localStorage.getItem('pomo_sound') || '{"on":false,"type":"white","vol":15}');
  let soundNode = null;
  let soundGain = null;

  const $timeText = document.getElementById('timeText');
  const $timeLabel = document.getElementById('timeLabel');
  const $ringFg = document.getElementById('ringFg');
  const $btnPlay = document.getElementById('btnPlay');
  const $btnReset = document.getElementById('btnReset');
  const $btnSkip = document.getElementById('btnSkip');
  const $sessionCount = document.getElementById('sessionCount');
  const $totalFocus = document.getElementById('totalFocus');
  const $tabs = document.querySelectorAll('.tab');
  const $taskInput = document.getElementById('taskInput');
  const $taskList = document.getElementById('taskList');
  const $btnAdd = document.getElementById('btnAdd');
  const $appRoot = document.getElementById('appRoot');
  const $opacitySlider = document.getElementById('opacitySlider');
  const $opacityValue = document.getElementById('opacityValue');
  const $btnSound = document.getElementById('btnSound');
  const $soundType = document.getElementById('soundType');
  const $soundVol = document.getElementById('soundVol');

  let chimeAudioContext = null;

  function clampOpacityPct(v) {
    const n = parseInt(String(v), 10);
    if (!Number.isFinite(n)) return OPACITY_MAX;
    return Math.min(OPACITY_MAX, Math.max(OPACITY_MIN, n));
  }

  function setPanelOpacity(raw) {
    const p = clampOpacityPct(raw);
    $appRoot.style.opacity = String(p / 100);
    $opacitySlider.value = String(p);
    $opacityValue.textContent = p + '%';
  }

  function persistPanelOpacity() {
    localStorage.setItem('pomo_app_opacity_pct', String(clampOpacityPct($opacitySlider.value)));
  }

  function init() {
    updateDisplay();
    updateRing(0);
    renderTasks();
    updateStats();
    updateSoundUI();
    const raw = localStorage.getItem('pomo_app_opacity_pct');
    setPanelOpacity(raw == null ? String(OPACITY_MAX) : raw);
    if (raw != null) {
      const fixed = String(clampOpacityPct(raw));
      if (fixed !== raw) localStorage.setItem('pomo_app_opacity_pct', fixed);
    }
  }

  function updateDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    $timeText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    $timeLabel.textContent = MODES[mode].label;
    document.title = `${$timeText.textContent} — ${MODES[mode].label} | 番茄钟`;
  }

  function updateRing(offsetOverride) {
    const total = MODES[mode].minutes * 60;
    const fraction = remainingSeconds / total;
    const offset = offsetOverride != null ? offsetOverride : CIRCUMFERENCE * (1 - fraction);
    $ringFg.style.strokeDashoffset = String(offset);
    $ringFg.classList.remove('short-mode', 'long-mode');
    if (mode === 'short') $ringFg.classList.add('short-mode');
    if (mode === 'long') $ringFg.classList.add('long-mode');
  }

  function setMode(newMode) {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      $btnPlay.textContent = '▶';
      $btnPlay.classList.remove('running');
    }
    mode = newMode;
    totalSeconds = MODES[mode].minutes * 60;
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';

    $tabs.forEach(t => {
      t.classList.remove('active');
      if (t.dataset.mode === mode) t.classList.add('active');
    });
  }

  function toggleTimer() {
    if (timerInterval) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    if (remainingSeconds <= 0) {
      remainingSeconds = totalSeconds;
      updateDisplay();
      updateRing();
    }
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
    timerInterval = setInterval(tick, 1000);
    $btnPlay.textContent = '⏸';
    $btnPlay.classList.add('running');
    if (soundPrefs.on) startSound();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    $ringFg.style.transition = 'none';
    $btnPlay.textContent = '▶';
    $btnPlay.classList.remove('running');
    stopSound();
  }

  function resetTimer() {
    pauseTimer();
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
  }

  function skipTimer() {
    pauseTimer();
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
    if (mode === 'focus') {
      playNotification();
    }
  }

  function tick() {
    remainingSeconds--;
    updateDisplay();
    updateRing();
    if (remainingSeconds <= 0) {
      pauseTimer();
      onTimerComplete();
    }
  }

  function onTimerComplete() {
    playNotification();
    $timeText.classList.add('pop');
    $ringFg.classList.add('pulse');
    setTimeout(() => {
      $timeText.classList.remove('pop');
      $ringFg.classList.remove('pulse');
    }, 700);
    if (mode === 'focus') {
      sessionCount++;
      totalFocusMin += MODES.focus.minutes;
      localStorage.setItem('pomo_sessions', sessionCount);
      localStorage.setItem('pomo_focus_min', totalFocusMin);
      updateStats();
    }
  }

  function updateStats() {
    $sessionCount.textContent = sessionCount;
    $totalFocus.textContent = totalFocusMin + ' min';
  }

  function playNotification() {
    const ctx = ensureAudioContext();
    // Mechanical chime — like a watch beep
    [880, 1108.73, 1318.51].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.35);
    });
    // Restart background sound after chime if it was playing
    if (soundPrefs.on) {
      setTimeout(() => { if (timerInterval) startSound(); }, 1200);
    }
  }

  // ── Sound ──

  function ensureAudioContext() {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!chimeAudioContext) chimeAudioContext = new Ctor();
    if (chimeAudioContext.state === 'suspended') void chimeAudioContext.resume();
    return chimeAudioContext;
  }

  function createNoiseBuffer(type) {
    const ctx = ensureAudioContext();
    const sr = ctx.sampleRate;
    const len = sr * 2; // 2-second loop
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);

    if (type === 'white') {
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } else if (type === 'pink') {
      // Paul Kellet's pink noise algorithm
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
        b6 = white * 0.115926;
      }
    } else if (type === 'brown') {
      let last = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.5;
      }
    } else if (type === 'rain') {
      for (let i = 0; i < len; i++) {
        const base = Math.random() * 2 - 1;
        // Amplitude modulation to simulate raindrop density variation
        const mod = 0.5 + 0.5 * Math.sin(i / sr * Math.PI * 1.3) * Math.sin(i / sr * Math.PI * 0.7);
        data[i] = base * mod * 0.7;
      }
    }
    return buf;
  }

  function startSound() {
    stopSound();
    const ctx = ensureAudioContext();
    const buf = createNoiseBuffer(soundPrefs.type);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const gain = ctx.createGain();
    gain.gain.value = soundPrefs.vol / 100;
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(0);
    soundNode = src;
    soundGain = gain;
  }

  function stopSound() {
    if (soundNode) {
      try { soundNode.stop(); } catch (_) { /* already stopped */ }
      soundNode.disconnect();
      soundNode = null;
      soundGain = null;
    }
  }

  function setSoundVolume(vol) {
    soundPrefs.vol = vol;
    if (soundGain) soundGain.gain.value = vol / 100;
  }

  function updateSoundUI() {
    $btnSound.classList.toggle('active', soundPrefs.on);
    $soundType.classList.toggle('visible', soundPrefs.on);
    $soundVol.classList.toggle('visible', soundPrefs.on);
    $soundType.value = soundPrefs.type;
    $soundVol.value = soundPrefs.vol;
  }

  function persistSoundPrefs() {
    localStorage.setItem('pomo_sound', JSON.stringify(soundPrefs));
  }

  // ── Tasks ──

  function renderTasks() {
    if (tasks.length === 0) {
      $taskList.innerHTML = '<li class="empty-hint">添加任务 · 开始专注</li>';
      return;
    }
    $taskList.innerHTML = tasks.map((t, i) => `
      <li class="task-item ${t.done ? 'done' : ''}" data-index="${i}">
        <div class="task-check" data-action="toggle">${t.done ? '✓' : ''}</div>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <button class="task-delete" data-action="delete">×</button>
      </li>
    `).join('');
  }

  function addTask() {
    const text = $taskInput.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    saveTasks();
    $taskInput.value = '';
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  function saveTasks() {
    localStorage.setItem('pomo_tasks', JSON.stringify(tasks));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── Events ──

  $btnPlay.addEventListener('click', toggleTimer);
  $btnReset.addEventListener('click', resetTimer);
  $btnSkip.addEventListener('click', skipTimer);

  $btnSound.addEventListener('click', () => {
    soundPrefs.on = !soundPrefs.on;
    persistSoundPrefs();
    updateSoundUI();
    if (soundPrefs.on && timerInterval) startSound();
    if (!soundPrefs.on) stopSound();
  });

  $soundType.addEventListener('change', () => {
    soundPrefs.type = $soundType.value;
    persistSoundPrefs();
    if (soundPrefs.on && timerInterval) { stopSound(); startSound(); }
  });

  $soundVol.addEventListener('input', () => {
    setSoundVolume(parseInt($soundVol.value));
  });
  $soundVol.addEventListener('change', () => {
    persistSoundPrefs();
  });

  $tabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab.dataset.mode));
  });

  $btnAdd.addEventListener('click', addTask);
  $taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  $opacitySlider.addEventListener('input', () => setPanelOpacity($opacitySlider.value));
  $opacitySlider.addEventListener('change', persistPanelOpacity);

  $taskList.addEventListener('click', e => {
    const li = e.target.closest('.task-item');
    if (!li) return;
    const index = parseInt(li.dataset.index);
    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
    if (action === 'toggle') toggleTask(index);
    if (action === 'delete') deleteTask(index);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
    if (e.code === 'KeyR') resetTimer();
    if (e.code === 'Digit1') setMode('focus');
    if (e.code === 'Digit2') setMode('short');
    if (e.code === 'Digit3') setMode('long');
    if (e.code === 'KeyS') {
      $btnSound.click();
    }
  });

  init();
</script>
</body>
</html>
