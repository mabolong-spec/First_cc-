<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 - Pomodoro Timer</title>
<style>
  :root {
    --bg: #1a1b2e;
    --surface: #252640;
    --focus: #ff6b6b;
    --short: #4ecdc4;
    --long: #5b7fef;
    --text: #e0e0e0;
    --text-dim: #8888aa;
    --ring-bg: #2a2b45;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    width: 480px;
    padding: 40px 36px;
    background: var(--surface);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .opacity-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 12px;
  }
  .opacity-row label {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
    min-width: 4em;
  }
  .opacity-row input[type="range"] {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--ring-bg);
    border-radius: 3px;
    outline: none;
  }
  .opacity-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--focus);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .opacity-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--focus);
    cursor: pointer;
  }
  .opacity-value {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-width: 2.5em;
    text-align: right;
  }

  /* Mode Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 36px;
  }
  .tab {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
  }
  .tab.active { background: var(--surface); color: var(--text); }
  .tab.focus.active { color: var(--focus); }
  .tab.short.active { color: var(--short); }
  .tab.long.active { color: var(--long); }

  /* Timer Ring */
  .timer-container {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
    position: relative;
  }
  .ring-wrapper { position: relative; width: 280px; height: 280px; }
  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 8;
  }
  .ring-fg {
    fill: none;
    stroke: var(--focus);
    stroke-width: 8;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  .ring-fg.short-mode { stroke: var(--short); }
  .ring-fg.long-mode { stroke: var(--long); }
  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time-text {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 1;
  }
  .time-label {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--ring-bg);
    background: transparent;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:hover { border-color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .btn-play {
    width: 68px; height: 68px;
    font-size: 26px;
    border-color: rgba(255,255,255,0.2);
  }
  .btn-play.running { border-color: var(--focus); color: var(--focus); }

  /* Session Info */
  .info-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 28px;
  }
  .info-item {
    text-align: center;
  }
  .info-value { font-size: 22px; font-weight: 600; }
  .info-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Task Input & List */
  .section-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .task-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .task-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--ring-bg);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .task-input:focus { border-color: var(--text-dim); }
  .task-input::placeholder { color: #555; }
  .btn-add {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--focus);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }

  .task-list { list-style: none; max-height: 180px; overflow-y: auto; }
  .task-list::-webkit-scrollbar { width: 4px; }
  .task-list::-webkit-scrollbar-thumb { background: var(--ring-bg); border-radius: 2px; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .task-item:hover { background: rgba(255,255,255,0.03); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text-dim); }
  .task-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .task-item.done .task-check { background: var(--short); border-color: var(--short); color: #fff; }
  .task-text { flex: 1; font-size: 14px; }
  .task-delete {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 2px 6px;
    opacity: 0; transition: opacity 0.15s;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--focus); }
  .empty-hint { text-align: center; color: var(--text-dim); font-size: 13px; padding: 16px 0; }
</style>
</head>
<body>

<div class="app" id="appRoot">
  <!-- Mode Tabs -->
  <div class="tabs">
    <button class="tab focus active" data-mode="focus">专注 25</button>
    <button class="tab short" data-mode="short">短休 5</button>
    <button class="tab long" data-mode="long">长休 15</button>
  </div>

  <!-- Timer -->
  <div class="timer-container">
    <div class="ring-wrapper">
      <svg width="280" height="280" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="124"/>
        <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="124"
                stroke-dasharray="779.115" stroke-dashoffset="0"/>
      </svg>
      <div class="time-display">
        <div class="time-text" id="timeText">25:00</div>
        <div class="time-label" id="timeLabel">专注</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="btnReset" title="重置">⟳</button>
    <button class="btn btn-play" id="btnPlay" title="开始">▶</button>
    <button class="btn" id="btnSkip" title="跳过">⏭</button>
  </div>

  <!-- Session Info -->
  <div class="info-row">
    <div class="info-item">
      <div class="info-value" id="sessionCount">0</div>
      <div class="info-label">今日番茄</div>
    </div>
    <div class="info-item">
      <div class="info-value" id="totalFocus">0 min</div>
      <div class="info-label">总专注时长</div>
    </div>
  </div>

  <div class="opacity-row">
    <label for="opacitySlider">透明度</label>
    <input type="range" id="opacitySlider" min="30" max="100" value="100" step="1" title="调节主面板透明度">
    <span class="opacity-value" id="opacityValue">100%</span>
  </div>

  <!-- Tasks -->
  <div class="section-title">📋 当前任务</div>
  <div class="task-input-row">
    <input class="task-input" id="taskInput" placeholder="添加任务..." maxlength="80">
    <button class="btn-add" id="btnAdd">添加</button>
  </div>
  <ul class="task-list" id="taskList"></ul>
</div>

<script>
  const MODES = {
    focus: { label: '专注', minutes: 25, color: '#ff6b6b', css: 'focus' },
    short: { label: '短休', minutes: 5, color: '#4ecdc4', css: 'short' },
    long:  { label: '长休', minutes: 15, color: '#5b7fef', css: 'long' }
  };

  const CIRCUMFERENCE = 2 * Math.PI * 124; // ≈779.115
  const OPACITY_MIN = 30;
  const OPACITY_MAX = 100;

  let mode = 'focus';
  let totalSeconds = MODES.focus.minutes * 60;
  let remainingSeconds = totalSeconds;
  let timerInterval = null;
  let sessionCount = parseInt(localStorage.getItem('pomo_sessions') || '0');
  let totalFocusMin = parseInt(localStorage.getItem('pomo_focus_min') || '0');
  let tasks = JSON.parse(localStorage.getItem('pomo_tasks') || '[]');

  const $timeText = document.getElementById('timeText');
  const $timeLabel = document.getElementById('timeLabel');
  const $ringFg = document.getElementById('ringFg');
  const $btnPlay = document.getElementById('btnPlay');
  const $btnReset = document.getElementById('btnReset');
  const $btnSkip = document.getElementById('btnSkip');
  const $sessionCount = document.getElementById('sessionCount');
  const $totalFocus = document.getElementById('totalFocus');
  const $tabs = document.querySelectorAll('.tab');
  const $taskInput = document.getElementById('taskInput');
  const $taskList = document.getElementById('taskList');
  const $btnAdd = document.getElementById('btnAdd');
  const $appRoot = document.getElementById('appRoot');
  const $opacitySlider = document.getElementById('opacitySlider');
  const $opacityValue = document.getElementById('opacityValue');

  let chimeAudioContext = null;

  function clampOpacityPct(v) {
    const n = parseInt(String(v), 10);
    if (!Number.isFinite(n)) return OPACITY_MAX;
    return Math.min(OPACITY_MAX, Math.max(OPACITY_MIN, n));
  }

  function setPanelOpacity(raw) {
    const p = clampOpacityPct(raw);
    $appRoot.style.opacity = String(p / 100);
    $opacitySlider.value = String(p);
    $opacityValue.textContent = p + '%';
  }

  function persistPanelOpacity() {
    localStorage.setItem('pomo_app_opacity_pct', String(clampOpacityPct($opacitySlider.value)));
  }

  function init() {
    updateDisplay();
    updateRing(0);
    renderTasks();
    updateStats();
    const raw = localStorage.getItem('pomo_app_opacity_pct');
    setPanelOpacity(raw == null ? String(OPACITY_MAX) : raw);
    if (raw != null) {
      const fixed = String(clampOpacityPct(raw));
      if (fixed !== raw) localStorage.setItem('pomo_app_opacity_pct', fixed);
    }
  }

  function updateDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    $timeText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    $timeLabel.textContent = MODES[mode].label;
    document.title = `${$timeText.textContent} - ${MODES[mode].label} | 番茄钟`;
  }

  function updateRing(offsetOverride) {
    const total = MODES[mode].minutes * 60;
    const fraction = remainingSeconds / total;
    const offset = offsetOverride != null ? offsetOverride : CIRCUMFERENCE * (1 - fraction);
    $ringFg.style.strokeDashoffset = String(offset);
    // Update color class
    $ringFg.classList.remove('short-mode', 'long-mode');
    if (mode === 'short') $ringFg.classList.add('short-mode');
    if (mode === 'long') $ringFg.classList.add('long-mode');
  }

  function setMode(newMode) {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      $btnPlay.textContent = '▶';
      $btnPlay.classList.remove('running');
    }
    mode = newMode;
    totalSeconds = MODES[mode].minutes * 60;
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    // Force reflow
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';

    // Update tabs
    $tabs.forEach(t => {
      t.classList.remove('active');
      if (t.dataset.mode === mode) t.classList.add('active');
    });
  }

  function toggleTimer() {
    if (timerInterval) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    if (remainingSeconds <= 0) {
      remainingSeconds = totalSeconds;
      updateDisplay();
      updateRing();
    }
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
    timerInterval = setInterval(tick, 1000);
    $btnPlay.textContent = '⏸';
    $btnPlay.classList.add('running');
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    $ringFg.style.transition = 'none';
    $btnPlay.textContent = '▶';
    $btnPlay.classList.remove('running');
  }

  function resetTimer() {
    pauseTimer();
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
  }

  function skipTimer() {
    pauseTimer();
    remainingSeconds = totalSeconds;
    $ringFg.style.transition = 'none';
    updateDisplay();
    updateRing();
    void $ringFg.offsetWidth;
    $ringFg.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s';
    if (mode === 'focus') {
      playNotification();
    }
  }

  function tick() {
    remainingSeconds--;
    updateDisplay();
    updateRing();
    if (remainingSeconds <= 0) {
      pauseTimer();
      onTimerComplete();
    }
  }

  function onTimerComplete() {
    playNotification();
    if (mode === 'focus') {
      sessionCount++;
      totalFocusMin += MODES.focus.minutes;
      localStorage.setItem('pomo_sessions', sessionCount);
      localStorage.setItem('pomo_focus_min', totalFocusMin);
      updateStats();
    }
  }

  function updateStats() {
    $sessionCount.textContent = sessionCount;
    $totalFocus.textContent = totalFocusMin + ' min';
  }

  function playNotification() {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    if (!chimeAudioContext) chimeAudioContext = new Ctor();
    const ctx = chimeAudioContext;
    if (ctx.state === 'suspended') void ctx.resume();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.4);
    });
  }

  // ── Tasks ──

  function renderTasks() {
    if (tasks.length === 0) {
      $taskList.innerHTML = '<li class="empty-hint">添加任务，开始专注吧 ✨</li>';
      return;
    }
    $taskList.innerHTML = tasks.map((t, i) => `
      <li class="task-item ${t.done ? 'done' : ''}" data-index="${i}">
        <div class="task-check" data-action="toggle">${t.done ? '✓' : ''}</div>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <button class="task-delete" data-action="delete">✕</button>
      </li>
    `).join('');
  }

  function addTask() {
    const text = $taskInput.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    saveTasks();
    $taskInput.value = '';
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  function saveTasks() {
    localStorage.setItem('pomo_tasks', JSON.stringify(tasks));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── Event Listeners ──

  $btnPlay.addEventListener('click', toggleTimer);
  $btnReset.addEventListener('click', resetTimer);
  $btnSkip.addEventListener('click', skipTimer);

  $tabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab.dataset.mode));
  });

  $btnAdd.addEventListener('click', addTask);
  $taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  $opacitySlider.addEventListener('input', () => setPanelOpacity($opacitySlider.value));
  $opacitySlider.addEventListener('change', persistPanelOpacity);

  $taskList.addEventListener('click', e => {
    const li = e.target.closest('.task-item');
    if (!li) return;
    const index = parseInt(li.dataset.index);
    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
    if (action === 'toggle') toggleTask(index);
    if (action === 'delete') deleteTask(index);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
    if (e.code === 'KeyR') resetTimer();
    if (e.code === 'Digit1') setMode('focus');
    if (e.code === 'Digit2') setMode('short');
    if (e.code === 'Digit3') setMode('long');
  });

  init();
</script>
</body>
</html>
